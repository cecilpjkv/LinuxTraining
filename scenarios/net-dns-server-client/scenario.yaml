name: Internal names stopped resolving after the DNS move
description: |
  Two servers: app (where you start) and ns1, the new internal DNS server (dnsmasq) for the corp.lan domain. The old
  DNS server was switched off last night. Since then app cannot resolve internal names such as intranet.corp.lan, and
  the inventory-sync service on app fails because it cannot find api.corp.lan. Make internal name resolution work on
  app through the new DNS server (no local workarounds). Open a second tab to work on ns1.
category: Networking
difficulty: advanced
docker_image: linux-training-base
time_limit: 40
resource_weight: 3
nodes:
  - {name: app, image: linux-training-base}
  - {name: ns1, image: linux-training-base}
collect:
  - cat /etc/resolv.conf /etc/hosts
  - cat /etc/dnsmasq.d/corp.conf
  - ss -lunp
