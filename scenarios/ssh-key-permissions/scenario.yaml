name: SSH key rejected after a permissions "fix"
description: |
  The support engineer's SSH key stopped working ("Permission denied (publickey)") after a colleague "fixed
  permissions" in the home directories so that a script could read them. Restore key login for "support" without
  weakening the SSH server's security checks.
category: SSH
difficulty: intermediate
docker_image: linux-training-base
time_limit: 20
resource_weight: 1
collect:
  - ls -ld /home/support /home/support/.ssh
  - ls -l /home/support/.ssh
