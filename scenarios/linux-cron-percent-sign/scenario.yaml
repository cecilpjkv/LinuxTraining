name: Nightly export never appears
description: |
  The order export is scheduled in /etc/cron.d/order-export (every minute while the team tests it) and should write
  /var/backups/orders/orders-YYYY-MM-DD.csv for the current day. Nothing has ever appeared there. Make the scheduled
  job work; wait for cron to run it and confirm today's file is written by the schedule.
category: Linux
difficulty: easy
docker_image: linux-training-base
time_limit: 20
resource_weight: 1
collect:
  - cat /etc/cron.d/order-export
  - ls -l /usr/local/bin/export-orders /var/backups/orders
