name: Monitoring cannot scrape the metrics endpoint
description: |
  The monitoring server cannot collect metrics from this server's metrics API (port 9100): "connection refused".
  On the server itself, `curl http://localhost:9100/metrics` works. Make the metrics endpoint reachable from the
  network on port 9100.
category: Networking
difficulty: intermediate
docker_image: linux-training-base
time_limit: 20
resource_weight: 2
collect:
  - ss -ltnp | grep 9100
  - cat /etc/metrics-api.conf
