name: Billing worker keeps restarting
description: |
  Invoices are no longer processed. The billing worker service keeps restarting. Its settings were moved to a new
  file during yesterday's maintenance. Jobs are waiting in the queue; get the worker processing them again.
category: Linux
difficulty: intermediate
docker_image: linux-training-base
time_limit: 25
resource_weight: 1
collect:
  - systemctl cat billing-worker
  - cat /etc/billing/billing.env
  - ls -la /var/spool/billing/*
