name: "Full cleanup after an intrusion"
description: |
  An attacker had root on this server for several days. Forensics is done; now the server must be cleaned without a
  reinstall. Find and remove every way back in they left. Keep everything legitimate working: administrator "admin"
  with its SSH key and sudo via wheel, the nightly cleanup job of "deploy", and the web service on port 8097.
category: Linux
difficulty: extra-hard
docker_image: linux-training-base
time_limit: 45
resource_weight: 1
collect:
  - "crontab -l -u deploy"
  - "ls /etc/cron.d /etc/systemd/system"
