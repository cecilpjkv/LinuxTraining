name: "Too many redirects after enabling HTTPS"
description: |
  After HTTPS was enabled for shop.example.test, browsers show "too many redirects" for both http:// and https://.
  Plain HTTP must redirect to HTTPS, and HTTPS must show the shop.
category: Nginx
difficulty: intermediate
docker_image: linux-training-web
time_limit: 20
resource_weight: 2
collect:
  - "curl -sI http://127.0.0.1/ -H 'Host: shop.example.test'"
  - "cat /etc/nginx/conf.d/shop.conf"
