name: "WordPress posts return 404"
description: |
  The blog's home page (wp.example.test) works, but every post and page (for example /hello-training/) returns
  "404 Not Found" since the web server configuration was rewritten during a server move. Fix it.
category: WordPress
difficulty: easy
docker_image: linux-training-lamp
time_limit: 15
resource_weight: 3
collect:
  - "cat /etc/nginx/conf.d/wp.conf"
