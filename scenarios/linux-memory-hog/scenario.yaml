name: Server out of memory
description: |
  The orders application on this server was killed twice this morning, and `free` shows almost no memory left.
  The server has not been changed recently, but a cache service was installed last week. Bring memory usage back to
  a healthy level. Both the orders application (port 8080) and the cache service must keep running.
category: Linux
difficulty: intermediate
docker_image: linux-training-base
time_limit: 25
resource_weight: 1
collect:
  - free -m
  - cat /etc/sysconfig/cache-warmer
  - ps -eo pid,rss,comm --sort=-rss | head -6
