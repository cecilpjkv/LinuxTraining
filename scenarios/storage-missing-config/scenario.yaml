name: Agent fails after a cleanup
description: |
  The ACME monitoring agent stopped after someone cleaned up "unused" files in /etc yesterday. It complains that its
  configuration file is missing. There is a nightly backup of /etc in /var/backups. Restore the agent; its
  configuration contains an API token and must not be readable by everybody.
category: Storage/Application
difficulty: intermediate
docker_image: linux-training-base
time_limit: 20
resource_weight: 1
collect:
  - ls -l /etc/acme/
  - ls -l /var/backups/
