name: "nginx does not start after hardening"
description: |
  nginx does not start any more after a hardening change to its main configuration ("run as a dedicated web user").
  The shop (shop.example.test) is down. Get nginx running again.
category: Nginx
difficulty: easy
docker_image: linux-training-web
time_limit: 15
resource_weight: 2
collect:
  - "nginx -t"
  - "grep -n '^user' /etc/nginx/nginx.conf"
