name: "A user can no longer log in"
description: |
  The account "deploy" can no longer open a shell: logging in or running "su - deploy" fails immediately with an
  error about its shell, while other accounts are fine. A recent change set this user's login shell to something
  that is not installed. Give deploy a working login shell again (a normal interactive shell), without removing the
  account or changing its home directory.
category: Linux
difficulty: easy
docker_image: linux-training-base
time_limit: 15
resource_weight: 1
collect:
  - "getent passwd deploy"
  - "ls -ld /home/deploy"
