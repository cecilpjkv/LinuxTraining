name: Shop cannot log in to its database
description: |
  The shop (shop.example.test) shows "Database connection failed" since this morning. The database team rotated
  application passwords overnight, as required by policy, and left a note on the server in /root/HANDOVER.txt.
  Get the shop working. The shop must keep using its own database account.
category: MariaDB
difficulty: intermediate
docker_image: linux-training-lamp
time_limit: 20
resource_weight: 3
collect:
  - cat /root/HANDOVER.txt
  - grep -n DB_ /srv/www/shop/config.php
