name: Web server logs never reach the log server
description: |
  Two servers: web01 (where you start) and logs, the central log server. Every message web01 logs through syslog must
  be stored on logs in /var/log/remote/web01.log (over TCP, port 514). Since the log server was "hardened" last week
  nothing arrives there any more. Make central logging work again, keeping the log server's firewall in place.
  Open a second tab to work on logs.
category: Networking
difficulty: advanced
docker_image: linux-training-base
time_limit: 40
resource_weight: 3
capabilities: [NET_ADMIN]
nodes:
  - {name: web01, image: linux-training-base}
  - {name: logs, image: linux-training-base}
collect:
  - cat /etc/rsyslog.d/*.conf
  - nft list ruleset
  - ss -ltnp
