name: "Files keep multiplying in a spool directory"
description: |
  /var/spool/upload fills with new random files faster than anyone can delete them, and the count never stops
  growing. Find the process that is creating them, stop it so it cannot start again (also not after a reboot),
  remove how it was made to persist, and clean up the directory.
category: Compromise
difficulty: intermediate
docker_image: linux-training-base
time_limit: 25
resource_weight: 1
collect:
  - "ls /var/spool/upload | wc -l"
  - "systemctl list-units --type=service --state=running --no-legend"
