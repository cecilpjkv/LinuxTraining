name: "HTTPS migration went wrong"
description: |
  The shop was moved to HTTPS yesterday. Today: nginx does not start, and before it stopped, customers reported
  endless redirects and being sent to a different host name. Requirements: https://shop.example.test shows the shop
  with the certificate from /etc/pki/shop (trusted by the company CA /etc/pki/ca-root.crt), and every
  http://shop.example.test URL redirects once to the same URL on https://shop.example.test.
category: Nginx
difficulty: extra-hard
docker_image: linux-training-web
time_limit: 40
resource_weight: 2
collect:
  - "nginx -t"
  - "cat /etc/nginx/conf.d/shop.conf"
  - "ls -l /etc/pki/shop"
