name: 403 Forbidden after a release
description: |
  Since this morning's release the shop (shop.example.test) answers "403 Forbidden" on its home page. The release
  changed the nginx site configuration. Make the home page work again without exposing directory listings.
category: Nginx
difficulty: easy
docker_image: linux-training-web
time_limit: 15
resource_weight: 2
collect:
  - cat /etc/nginx/conf.d/shop.conf
  - tail -5 /var/log/nginx/error.log
