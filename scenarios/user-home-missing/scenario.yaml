name: Analyst cannot log in properly
description: |
  The analyst account logs in with an SSH key, but since a cleanup script ran, logins fail. The script removed
  "unused" home directories. The analyst's public key is kept in /root/keys/analyst.pub. Restore the analyst's
  login and a normal, private home directory.
category: Linux
difficulty: easy
docker_image: linux-training-base
time_limit: 15
resource_weight: 1
collect:
  - "ls -ld /home/*"
