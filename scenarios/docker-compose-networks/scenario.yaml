name: Portal proxy cannot reach its API
description: |
  The customer portal runs with Docker Compose from /srv/portal: an nginx proxy published on port 8090 forwards
  /api/ to the internal "api" service. Since the project was reorganised the proxy does not stay up and
  http://localhost:8090/api/status.json does not work. Get it working. The api service must stay internal: it must
  not be published on the host.
category: Docker
difficulty: advanced
docker_image: linux-training-devops
time_limit: 35
resource_weight: 2
nested_containers: true
collect:
  - cat /srv/portal/compose.yaml /srv/portal/proxy/default.conf
  - docker ps -a
