name: Sessions fail although the disk has free space
description: |
  The web shop cannot create new customer sessions: its log says "Could not create session file: No space left on
  device". `df -h` shows that the filesystem still has plenty of free space. Sessions are stored in
  /srv/spool/sessions; active sessions (from today) must keep working. Fix the problem and make sure it does not
  happen again.
category: Linux
difficulty: advanced
docker_image: linux-training-base
time_limit: 35
resource_weight: 1
tmpfs:
  /srv/spool: {size: 64, inodes: 2000}
collect:
  - df -h /srv/spool
  - df -i /srv/spool
  - cat /etc/cron.d/session-cleanup
