name: Jobs fail to create temporary files
description: |
  Since a cleanup script ran last night, the report builder (and other non-root jobs) fail with
  "mktemp: failed to create file via template '/tmp/tmp.XXXXXXXXXX': Permission denied". Fix the server so every
  user can create temporary files safely again.
category: Storage/Application
difficulty: intermediate
docker_image: linux-training-base
time_limit: 20
resource_weight: 1
collect:
  - ls -ld /tmp /var/tmp
