name: Support account cannot log in
description: |
  The support engineers cannot log in to this server as "support" any more: "Your account has expired; please contact
  your system administrator". The account is still needed. Restore its SSH key login.
category: Linux
difficulty: easy
docker_image: linux-training-base
time_limit: 15
resource_weight: 1
collect:
  - "chage -l support"
