name: 502 Bad Gateway after PHP-FPM tuning
description: |
  After a colleague "tidied up" the PHP-FPM pool configuration yesterday, the shop (shop.example.test) returns
  "502 Bad Gateway" on every PHP page. PHP-FPM itself is running. Get the shop working again.
category: PHP-FPM
difficulty: intermediate
docker_image: linux-training-web
time_limit: 20
resource_weight: 2
collect:
  - grep -E '^listen' /etc/php-fpm.d/www.conf
  - ls -l /run/php-fpm/
  - tail -3 /var/log/nginx/error.log
