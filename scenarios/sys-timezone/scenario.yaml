name: Report times are off by hours
description: |
  Reports generated on this server show the wrong time. The company standard is that all servers use the time zone
  Europe/Amsterdam; this one was reinstalled with UTC. Fix the server's time zone (it must survive a reboot).
category: Linux
difficulty: easy
docker_image: linux-training-base
time_limit: 15
resource_weight: 1
collect:
  - "ls -l /etc/localtime"
  - "date"
