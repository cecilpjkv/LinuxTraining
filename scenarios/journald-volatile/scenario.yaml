name: Logs disappear after every reboot
description: |
  After every reboot, the system journal only shows messages since that boot; incident analysis needs older logs.
  Make the journal keep its logs across reboots.
category: Linux
difficulty: intermediate
docker_image: linux-training-base
time_limit: 20
resource_weight: 1
collect:
  - "ls /etc/systemd/journald.conf.d/"
  - "journalctl --header | head -5"
