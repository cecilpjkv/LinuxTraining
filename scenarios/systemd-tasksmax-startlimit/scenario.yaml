name: Thread pool service gave up starting
description: |
  The image converter service crashed this morning with "can't start new thread" and now systemd does not even try to
  start it any more. It uses a pool of 40 worker threads. Get it running reliably.
category: Linux
difficulty: advanced
docker_image: linux-training-base
time_limit: 30
resource_weight: 1
collect:
  - "systemctl status image-converter --no-pager"
  - "systemctl cat image-converter"
