name: "Services fail after a permissions script"
description: |
  A script meant to "secure /etc" ran on this server. Since then services that run as normal users fail to start, and
  the security scanner flags a critical finding. Repair the system files' permissions.
category: Linux
difficulty: advanced
docker_image: linux-training-base
time_limit: 25
resource_weight: 1
collect:
  - "ls -l /etc/passwd /etc/group /etc/shadow /etc/gshadow"
